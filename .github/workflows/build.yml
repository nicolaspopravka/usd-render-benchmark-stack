name: CY2027 software demo check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build maintained CY2027 and check software demo
        run: bash tools/software-demo-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cy2027-software-demo
          path: results/
