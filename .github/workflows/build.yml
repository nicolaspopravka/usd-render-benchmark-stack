name: CY2026 software demo check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate and run published and candidate software demos
        run: bash tools/software-demo-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cy2026-software-demo
          path: results/
