name: Check candidate loading
on:
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check loading without rendering
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker run --rm "$IMAGE" bash -lc '
            set -euo pipefail
            ldd -r /opt/cycles/hydra/hdCycles.so | tee /tmp/linkage.txt
            if grep -E "not found|undefined symbol" /tmp/linkage.txt; then exit 1; fi
            python3 -c "from pxr import Plug; p=Plug.Registry().GetPluginWithName(\"hdCycles\"); assert p is not None; assert p.Load(); print(\"PLUGIN_LOAD_PASS\", p.path)"
            /opt/cycles/bin/cycles --help
            usdrecord --help
          '
