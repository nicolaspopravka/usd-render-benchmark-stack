name: Build stack

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile JSON path
        required: true
        default: profiles/cy2025.json
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pristine and runnable
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 tools/build.py "$PROFILE" --push
