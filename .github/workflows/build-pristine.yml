name: build-pristine

# Builds + publishes the pristine stack image:
#   ghcr.io/nicolaspopravka/usd-render-benchmark-stack:<tag>
# A trivial retag of the ASWF base (base_image input). Dispatch-only; the output
# tag is propagated unchanged from the base_image tag (aswf/ci-vfxall:<tag>@sha256:...).

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "ASWF base to retag, e.g. aswf/ci-vfxall:2025@sha256:..."
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pristine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the output image from base_image
        run: |
          src="$(printf '%s' '${{ inputs.base_image }}' | cut -d'@' -f1)"
          case "$src" in
            aswf/ci-vfxall:*) : ;;
            *) echo "unexpected base image (want aswf/ci-vfxall:<tag>): $src"; exit 1 ;;
          esac
          tag="${src#aswf/ci-vfxall:}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "invalid Docker tag: $tag"; exit 1
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "PRISTINE_IMAGE=ghcr.io/nicolaspopravka/usd-render-benchmark-stack:${tag}" >> "$GITHUB_ENV"

      - name: Build + push pristine
        run: |
          set -o pipefail
          docker buildx build --provenance=false \
            --file Dockerfile.pristine \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --tag "${{ env.PRISTINE_IMAGE }}" \
            --metadata-file .buildx-metadata.json \
            --push \
            . 2>&1 | tee build-pristine.log

      - name: Verify the tag resolves to the digest this run pushed
        run: |
          pushed="$(python3 -c 'import json;print(json.load(open(".buildx-metadata.json"))["containerimage.digest"])')"
          resolved="$(docker buildx imagetools inspect "${{ env.PRISTINE_IMAGE }}" --format '{{.Manifest.Digest}}')"
          echo "pushed=$pushed"
          echo "resolved=$resolved"
          test "$pushed" = "$resolved" || {
            echo "ERROR: ${{ env.PRISTINE_IMAGE }} does not resolve to the digest this run pushed"; exit 1
          }
          echo "verified: ${{ env.PRISTINE_IMAGE }} @ $resolved"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pristine-build-log
          path: build-pristine.log
          if-no-files-found: warn