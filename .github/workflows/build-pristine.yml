name: build-pristine

# Builds + publishes the pristine stack image:
#   ghcr.io/nicolaspopravka/usd-render-benchmark-stack:<tag>
# Base image (base_image input) retagged, with the optional Cycles build
# (cycles_tag input). Dispatch-only; image_tag selects the output tag without
# interpreting the base image reference.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build from, e.g. aswf/ci-vfxall:2027@sha256:..."
        required: true
        type: string
      image_tag:
        description: "Tag for the published stack image, e.g. 2027"
        required: true
        type: string
      image_version:
        description: "Value for org.opencontainers.image.version. Defaults to the image_tag."
        required: false
        default: ""
        type: string
      cycles_tag:
        description: "Cycles ref to build: a git tag (e.g. v5.0.0), or a branch name when cycles_repo points at a fork. Empty = pure retag."
        required: false
        default: ""
        type: string
      cycles_repo:
        description: "Git URL Cycles is cloned from. Default: upstream Blender cycles. Set when cycles_tag names a ref that exists only on a fork."
        required: false
        default: ""
        type: string
      with_cycles_osl:
        description: "Build Cycles with OSL (OFF for the affected CY2023/CY2024 bases)."
        required: true
        default: "ON"
        type: choice
        options:
          - "ON"
          - "OFF"
      with_cycles_openvdb:
        description: "Build Cycles with OpenVDB (OFF for older Cycles without delayed-loading guards)."
        required: true
        default: "ON"
        type: choice
        options:
          - "ON"
          - "OFF"
      moonray_tag:
        description: "OpenMoonRay ref to build: a git tag (e.g. v2026.29.1), or a branch name when moonray_repo points at a fork. Empty = no MoonRay build."
        required: false
        default: ""
        type: string
      moonray_repo:
        description: "Git URL OpenMoonRay is cloned from. Default: upstream OpenMoonRay/openmoonray. Set when moonray_tag names a ref that exists only on a fork."
        required: false
        default: ""
        type: string
      moonray_toolset:
        description: "Optional gcc-toolset (e.g. gcc-toolset-12) MoonRay builds with. Empty = the image's default compiler. CY2026 needs it: the default gcc-toolset-14 is outside CUDA 12.9's host range and dropped the transitive includes MoonRay relies on."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pristine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PRISTINE_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark-stack:${{ inputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the output tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "invalid Docker tag: $IMAGE_TAG"
            exit 1
          }

      - name: Build + push pristine
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          CYCLES_TAG: ${{ inputs.cycles_tag }}
          CYCLES_REPO: ${{ inputs.cycles_repo }}
          WITH_CYCLES_OSL: ${{ inputs.with_cycles_osl }}
          WITH_CYCLES_OPENVDB: ${{ inputs.with_cycles_openvdb }}
          MOONRAY_TAG: ${{ inputs.moonray_tag }}
          MOONRAY_REPO: ${{ inputs.moonray_repo }}
          MOONRAY_TOOLSET: ${{ inputs.moonray_toolset }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -o pipefail
          VERSION="${IMAGE_VERSION:-$IMAGE_TAG}"
          BASE_NAME="$BASE_IMAGE"
          BASE_DIGEST=""
          case "$BASE_IMAGE" in *@*) BASE_DIGEST="${BASE_IMAGE##*@}" ;; esac
          case "$BASE_NAME" in
            */*) host="${BASE_NAME%%/*}"
                 case "$host" in *.*|*:*|localhost) ;; *) BASE_NAME="docker.io/$BASE_NAME" ;; esac ;;
            *)   BASE_NAME="docker.io/$BASE_NAME" ;;
          esac
          docker buildx build --provenance=false \
            --file Dockerfile.pristine \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg CYCLES_TAG="$CYCLES_TAG" \
            --build-arg CYCLES_REPO="$CYCLES_REPO" \
            --build-arg WITH_CYCLES_OSL="$WITH_CYCLES_OSL" \
            --build-arg WITH_CYCLES_OPENVDB="$WITH_CYCLES_OPENVDB" \
            --build-arg MOONRAY_TAG="$MOONRAY_TAG" \
            --build-arg MOONRAY_REPO="$MOONRAY_REPO" \
            --build-arg MOONRAY_TOOLSET="$MOONRAY_TOOLSET" \
            --build-arg IMAGE_VERSION="$VERSION" \
            --build-arg BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BASE_NAME="$BASE_NAME" \
            --build-arg BASE_DIGEST="$BASE_DIGEST" \
            --tag "$PRISTINE_IMAGE" \
            --metadata-file .buildx-metadata.json \
            --push \
            . 2>&1 | tee build-pristine.log

      - name: Verify the tag resolves to the digest this run pushed
        run: |
          pushed="$(python3 -c 'import json;print(json.load(open(".buildx-metadata.json"))["containerimage.digest"])')"
          resolved="$(docker buildx imagetools inspect "$PRISTINE_IMAGE" --format '{{.Manifest.Digest}}')"
          test "$pushed" = "$resolved" || {
            echo "ERROR: $PRISTINE_IMAGE does not resolve to the digest this run pushed"; exit 1
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pristine-build-log
          path: build-pristine.log
          if-no-files-found: warn
