name: build-pristine

# Builds + publishes the pristine stack image:
#   ghcr.io/nicolaspopravka/usd-render-benchmark-stack:<tag>
# Base image (base_image input) retagged, with the optional Cycles feature
# (cycles_tag input). Dispatch-only; image_tag selects the output tag without
# interpreting the base image reference.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build from, e.g. ghcr.io/nicolaspopravka/usd-render-benchmark-stack:2025.2@sha256:..."
        required: true
        type: string
      image_tag:
        description: "Tag for the published stack image, e.g. 2027 or 2027.3"
        required: true
        type: string
      cycles_tag:
        description: "Cycles git tag to build (e.g. v5.0.0). Empty = pure retag."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pristine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PRISTINE_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark-stack:${{ inputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          CYCLES_TAG: ${{ inputs.cycles_tag }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "invalid Docker tag: $IMAGE_TAG"
            exit 1
          }
          [[ "$BASE_IMAGE" == *@sha256:* ]] || {
            echo "base_image must be digest-pinned (@sha256:...)"
            exit 1
          }
          if [[ -n "$CYCLES_TAG" ]]; then
            [[ "$CYCLES_TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || {
              echo "cycles_tag must look like a tag (v5.0.0)"
              exit 1
            }
          fi

      - name: Build + push pristine
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          CYCLES_TAG: ${{ inputs.cycles_tag }}
        run: |
          set -o pipefail
          docker buildx build --provenance=false \
            --file Dockerfile.pristine \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg CYCLES_TAG="$CYCLES_TAG" \
            --tag "$PRISTINE_IMAGE" \
            --metadata-file .buildx-metadata.json \
            --push \
            . 2>&1 | tee build-pristine.log

      - name: Verify the tag resolves to the digest this run pushed
        run: |
          pushed="$(python3 -c 'import json;print(json.load(open(".buildx-metadata.json"))["containerimage.digest"])')"
          resolved="$(docker buildx imagetools inspect "$PRISTINE_IMAGE" --format '{{.Manifest.Digest}}')"
          test "$pushed" = "$resolved" || {
            echo "ERROR: $PRISTINE_IMAGE does not resolve to the digest this run pushed"; exit 1
          }

      - name: Post-push closure check (Cycles)
        # ldd is deliberately run AFTER build + push, in the published image.
        if: ${{ inputs.cycles_tag != '' }}
        env:
          PRISTINE_IMAGE: ${{ env.PRISTINE_IMAGE }}
        run: |
          docker run --rm --entrypoint bash "$PRISTINE_IMAGE" -c '
            set -e
            plugin=/usr/local/plugin/usd/hdCycles/hdCycles.so
            test -f "$plugin"
            # No Blender bundle may exist.
            test ! -e /opt/cycles && test ! -e /opt/cycles-dependencies
            out=$(ldd -r "$plugin" 2>&1) || true
            printf "%s\n" "$out" | tee /tmp/hdCycles-ldd.txt
            if printf "%s\n" "$out" | grep -Eq "not found|undefined symbol"; then
              echo "ERROR: unresolved symbols in hdCycles.so"
              exit 1
            fi
            printf "%s\n" "$out" | grep -Fq "libOpenImageIO.so" || {
              echo "ERROR: OIIO not linked (expected the base /usr/local OIIO)"
              exit 1
            }
            pxr_dir=$(find /usr/local/lib -maxdepth 4 -type d -name pxr -print -quit)
            test -n "$pxr_dir"
            PYTHONPATH="$(dirname "$pxr_dir")" python3 -c "from pxr import Usd, UsdImagingGL; names=[UsdImagingGL.Engine.GetRendererDisplayName(p) for p in UsdImagingGL.Engine.GetRendererPlugins()]; print(\"renderers:\", names); assert \"Cycles\" in names, \"Cycles plugin not enumerated by default discovery\""
          '

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pristine-build-log
          path: |
            build-pristine.log
            /tmp/hdCycles-ldd.txt
          if-no-files-found: warn