name: promote-release-tag

# Point a released registry tag at an already-published image digest.
#
# The build workflows publish under explicit candidate tags (e.g.
# 2025.3-default). This moves the released tag (2025.3) onto that digest, so a
# release is a deliberate, recorded act rather than something a build does as a
# side effect: a build can only ever write to the tag it was dispatched with.
#
# The image is never pulled. imagetools rewrites the manifest reference, so
# this is a registry-side copy of a tag and costs nothing but a PUT.
#
# Both ends are verified: the source must already resolve to the digest given,
# and the destination must then serve the same per-platform manifests. A partial
# or mis-typed digest fails the run rather than moving a release tag somewhere
# unintended.
#
# Note the shape change this implies: imagetools create re-serialises the
# manifest list, so promoting a single-platform build turns a plain manifest into
# a list of one and the index digest changes even though the image does not. The
# check therefore compares per-platform manifest digests, which is the invariant
# that actually holds.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Registry package holding the image, e.g. usd-render-benchmark-stack"
        required: true
        type: string
      source_tag:
        description: "Tag the image was published under, e.g. 2025.3-default"
        required: true
        type: string
      digest:
        description: "sha256 digest of the source image, without the algorithm prefix repeated"
        required: true
        type: string
      release_tag:
        description: "Released tag to move onto that digest, e.g. 2025.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          DIGEST: ${{ inputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "digest must look like sha256:<64 hex>: [$DIGEST]" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "invalid release tag: [$RELEASE_TAG]" >&2; exit 1; }
          # A release tag must not be the candidate tag; promoting a tag onto
          # itself is a no-op that usually means the wrong value was typed.
          if [ "$RELEASE_TAG" = "$SOURCE_TAG" ]; then
            echo "release tag and source tag are the same: [$RELEASE_TAG]" >&2; exit 1
          fi
          echo "promote $PACKAGE:$RELEASE_TAG -> $PACKAGE:$SOURCE_TAG@$DIGEST"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the source resolves to the requested digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ inputs.source_tag }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          resolved="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{.Manifest.Digest}}' | awk '{print $NF}')"
          if [ "$resolved" != "$DIGEST" ]; then
            echo "ERROR: $IMAGE resolves to $resolved, not the requested $DIGEST" >&2
            exit 1
          fi
          echo "source verified: $resolved"

      - name: Point the release tag at that digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ inputs.source_tag }}
          DIGEST: ${{ inputs.digest }}
          RELEASE: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$RELEASE" "$IMAGE@$DIGEST"

      - name: Verify the release tag now serves the same image content
        env:
          SOURCE: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ inputs.source_tag }}
          RELEASE: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Compare the per-platform manifest digests, not the index digest.
          # imagetools create re-serialises the manifest list, so the index digest
          # cannot survive a tag copy - and for a single-platform build it
          # promotes a plain manifest into a list of one. The content is what has
          # to be preserved, so that is what is compared.
          platforms() {
            docker buildx imagetools inspect "$1" --raw 2>/dev/null | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          if "manifests" in m:
              for e in m["manifests"]:
                  p = e.get("platform", {})
                  name = p.get("os", "?") + "/" + p.get("architecture", "?")
                  if p.get("variant"):
                      name += "/" + p["variant"]
                  print(name + " " + e["digest"])
          else:
              print("single " + m.get("config", {}).get("digest", ""))
          '
          }
          before="$(platforms "$SOURCE" | sort)"
          after="$(platforms "$RELEASE" | sort)"
          echo "source platforms:";   echo "$before" | sed 's/^/  /'
          echo "release platforms:";  echo "$after"  | sed 's/^/  /'
          if [ "$before" != "$after" ]; then
            echo "ERROR: $RELEASE does not serve the same image content as $SOURCE" >&2
            exit 1
          fi
          echo "promoted: $RELEASE now serves the same content as $SOURCE"
