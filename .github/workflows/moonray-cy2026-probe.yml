name: moonray-cy2026-probe

# Free CY2026 MoonRay feasibility probe — ExecPlan Phase 2
# (benchmark repo: docs/cy2026-moonray-image-execplan.md).
#
#   Job A: does the patched combined source (usd26-moonray) build against
#          USD 26.03 on aswf/ci-moonray:2026.6 — the base GH #48 failed on?
#   Job B: what does the published stack:2026.3 lack for MoonRay, and can
#          MoonRay build on it directly after provisioning the gap from
#          ci-moonray:2026.6?
#
# Nothing is published: no images, no tags. Logs + inventories are the
# artifacts. Push-triggered on this branch only — workflow_dispatch resolves
# only on the default branch (same reason as the GH #51 probe).

on:
  push:
    branches:
      - opencode/probe-cy2026-moonray

permissions:
  contents: read
  packages: read

concurrency:
  group: moonray-cy2026-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-build:
    name: "Job A: patched source on ci-moonray:2026.6"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Host compiler matrix
        shell: bash
        run: bash probe/host_compiler_probe.sh

      - name: Source build
        shell: bash
        run: bash probe/job_a_source_build.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-a-source-build
          path: probe/out/
          if-no-files-found: warn

  dep-inventory:
    name: "Job B: stack:2026.3 inventory + build"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inventory, provision, build
        shell: bash
        run: bash probe/job_b_dep_inventory.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-b-dep-inventory
          path: probe/out/
          if-no-files-found: warn
