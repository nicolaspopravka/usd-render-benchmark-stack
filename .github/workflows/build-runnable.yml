name: build-runnable

# Builds + publishes the runnable environment overlay:
#   ghcr.io/nicolaspopravka/usd-render-benchmark:<tag>
# FROM the published pristine image (pristine_image input). Dispatch-only; the
# image_tag input is propagated unchanged to the output image.

on:
  workflow_dispatch:
    inputs:
      pristine_image:
        description: "Published pristine image, e.g. ghcr.io/nicolaspopravka/usd-render-benchmark-stack:2027"
        required: true
        type: string
      image_tag:
        description: "Tag for the published runnable image, e.g. 2027"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: runnable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUNNABLE_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark:${{ inputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the output tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "invalid Docker tag: $IMAGE_TAG"
            exit 1
          }

      - name: Build + push runnable
        env:
          PRISTINE_IMAGE_INPUT: ${{ inputs.pristine_image }}
        run: |
          set -o pipefail
          docker buildx build --provenance=false \
            --file Dockerfile.runnable \
            --build-arg PRISTINE_IMAGE="$PRISTINE_IMAGE_INPUT" \
            --tag "$RUNNABLE_IMAGE" \
            --metadata-file .buildx-metadata.json \
            --push \
            . 2>&1 | tee build-runnable.log

      - name: Verify the tag resolves to the digest this run pushed
        run: |
          pushed="$(python3 -c 'import json;print(json.load(open(".buildx-metadata.json"))["containerimage.digest"])')"
          resolved="$(docker buildx imagetools inspect "$RUNNABLE_IMAGE" --format '{{.Manifest.Digest}}')"
          test "$pushed" = "$resolved" || {
            echo "ERROR: $RUNNABLE_IMAGE does not resolve to the digest this run pushed"; exit 1
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runnable-build-log
          path: build-runnable.log
          if-no-files-found: warn
