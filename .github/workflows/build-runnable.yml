name: build-runnable

# Builds + publishes the runnable environment overlay:
#   ghcr.io/nicolaspopravka/usd-render-benchmark:<year>
# FROM the published pristine image (pristine_image input). Dispatch-only; the
# year is derived from pristine_image (…:<year>).

on:
  workflow_dispatch:
    inputs:
      pristine_image:
        description: "Published pristine image, e.g. ghcr.io/nicolaspopravka/usd-render-benchmark-stack:2025"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: runnable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive year and runnable image from pristine_image
        run: |
          pristine='${{ inputs.pristine_image }}'
          case "$pristine" in
            ghcr.io/nicolaspopravka/usd-render-benchmark-stack:202[3-7]) : ;;
            *) echo "unexpected pristine image (want ghcr.io/nicolaspopravka/usd-render-benchmark-stack:<2023-2027>): $pristine"; exit 1 ;;
          esac
          year="${pristine##*:}"
          echo "RUNNABLE_IMAGE=ghcr.io/nicolaspopravka/usd-render-benchmark:${year}" >> "$GITHUB_ENV"

      - name: Build + push runnable
        run: |
          set -o pipefail
          docker buildx build --provenance=false \
            --file Dockerfile.runnable \
            --build-arg PRISTINE_IMAGE="${{ inputs.pristine_image }}" \
            --tag "${{ env.RUNNABLE_IMAGE }}" \
            --metadata-file .buildx-metadata.json \
            --push \
            . 2>&1 | tee build-runnable.log

      - name: Verify the tag resolves to the digest this run pushed
        run: |
          pushed="$(python3 -c 'import json;print(json.load(open(".buildx-metadata.json"))["image.digest"])')"
          resolved="$(docker buildx imagetools inspect "${{ env.RUNNABLE_IMAGE }}" --format '{{.Manifest.Digest}}')"
          echo "pushed=$pushed"
          echo "resolved=$resolved"
          test "$pushed" = "$resolved" || {
            echo "ERROR: ${{ env.RUNNABLE_IMAGE }} does not resolve to the digest this run pushed"; exit 1
          }
          echo "verified: ${{ env.RUNNABLE_IMAGE }} @ $resolved"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runnable-build-log
          path: build-runnable.log
          if-no-files-found: warn