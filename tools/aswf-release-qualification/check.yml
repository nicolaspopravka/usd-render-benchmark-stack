# Copy to .github/workflows/qualify-aswf-october27.yml on an approved diagnostic
# branch. This file has no active trigger at its current location.
name: Qualify October 27 ASWF release
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [consumer, render]
        default: consumer
      year:
        description: Render year; start with 2025, inspect it before 2024/2026
        type: choice
        options: ['2025', '2024', '2026']
        default: '2025'
permissions:
  contents: read
jobs:
  consumer:
    if: inputs.phase == 'consumer'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ['2023', '2024', '2025', '2026', '2027']
    steps:
      - uses: actions/checkout@v4
      - name: Check external OpenUSD consumer
        run: bash tools/aswf-release-qualification/run-consumer.sh '${{ matrix.year }}' "$PWD/results/consumer"
      - uses: actions/checkout@v4
        if: matrix.year == '2025'
        with:
          repository: OpenMoonRay/openmoonray
          ref: d96c6e30a8c280d4b5eb3bafa5e54efc445d7ea8
          submodules: recursive
          lfs: true
          path: moonray
      - name: Configure unmodified OpenMoonRay on CY2025
        if: matrix.year == '2025'
        run: |
          git -C moonray rev-parse HEAD > results/moonray-source.txt
          git -C moonray submodule status --recursive >> results/moonray-source.txt
          image=$(awk -F '\t' '$1 == 2025 {print $2}' tools/aswf-release-qualification/images.tsv)
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/tools/aswf-release-qualification:/probe:ro" \
            -v "$PWD/moonray:/source:ro" -v "$PWD/results:/results" \
            "$image" /probe/moonray.sh /source /results/moonray
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-cy${{ matrix.year }}
          path: results/
          if-no-files-found: error
  render:
    if: inputs.phase == 'render'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nicolaspopravka/usd-render-benchmark-stack
          ref: f99bfd5959a529a7bbbc385fc53e0314bf9f4459
          path: recipe
      - uses: actions/checkout@v4
        with:
          repository: nicolaspopravka/usd-render-benchmark
          ref: 0649e883134579fa1ad7a46daa072cfafac2cef0
          submodules: recursive
          lfs: true
          path: benchmark
      - name: Build locally and render Teapot
        run: bash tools/aswf-release-qualification/run-render.sh '${{ inputs.year }}' recipe benchmark "$PWD/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-cy${{ inputs.year }}
          path: results/
          if-no-files-found: error
